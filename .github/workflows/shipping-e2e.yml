name: Shipping label browser E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL of the disposable authenticated test deployment
        required: true
        type: string
      order_id:
        description: Paid order owned by the test seller
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    environment: shipping-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Restore disposable seller session
        run: printf '%s' "$E2E_AUTH_STATE_BASE64" | base64 --decode > "$RUNNER_TEMP/fewya-e2e-auth.json"
        env:
          E2E_AUTH_STATE_BASE64: ${{ secrets.E2E_AUTH_STATE_BASE64 }}
      - run: bun run test:e2e:shipping
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_AUTH_STATE: ${{ runner.temp }}/fewya-e2e-auth.json
          E2E_SHIPPING_ORDER_ID: ${{ inputs.order_id }}
